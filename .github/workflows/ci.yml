name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # No DATABASE_URL, so the app runs on the in-memory store.
      - name: Cypress
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm start
          wait-on: "http://localhost:3000"
